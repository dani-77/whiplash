# xdg-desktop-portal backends for the whiplash session, picked because
# whiplash-session exports XDG_CURRENT_DESKTOP=whiplash.
#
# wlr covers ScreenCast and Screenshot (whiplash implements wlr-screencopy
# and export-dmabuf, which xdg-desktop-portal-wlr needs); gtk covers the
# rest (file chooser, settings, ...) without a full desktop behind it.
# Same setup as wasp and spitfire.
[preferred]
default=gtk
org.freedesktop.impl.portal.Secret=gnome-keyring
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
